      baseline.progress.activityWork = typeof p.activityWork === 'object' && p.activityWork ? p.activityWork : {};
      baseline.progress.capstone = typeof p.capstone === 'object' && p.capstone ? p.capstone : {};
      return baseline;
    }

    function loadState() {
      const raw = localStorage.getItem(STORAGE_KEY) || localStorage.getItem('yocahu_agroecologia_pr_progress_v1');
      if (!raw) return defaultState();
      try { return normalizeProgress(JSON.parse(raw)); }
      catch { return defaultState(); }
    }

    function saveState() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
      updateNav();
    }

    function getLevelStatus(level) {
      const done = state.progress.completedLevels.includes(Number(level.id));
      if (done) return 'done';
      if (Number(level.id) === 0) return 'available';
      const req = level.unlockRule || {};
      if (req.type === 'completeLevel') {
        return state.progress.completedLevels.includes(Number(req.levelId)) ? 'available' : 'locked';
      }
      return 'available';
    }

    function isActivityDone(id) { return state.progress.completedActivities.includes(id); }
    function activityWork(id) {
      state.progress.activityWork[id] ||= {};
      return state.progress.activityWork[id];
    }

    function completeLevelIfReady(levelId) {
      const level = levelById(levelId);
      if (!level) return;
      const allDone = level.activityIds.every(isActivityDone);
      if (!allDone || state.progress.completedLevels.includes(Number(levelId))) return;
      state.progress.completedLevels.push(Number(levelId));
      const bonus = Number(level.id) === 12 ? 0 : Number(level.pointsToComplete || 0);
      state.progress.points += bonus;
      const badge = badgeById(level.badgeId);
      if (badge && !state.progress.badges.includes(badge.id)) state.progress.badges.push(badge.id);
      state.progress.currentLevel = Math.max(Number(state.progress.currentLevel || 0), Number(levelId) + 1);
      saveState();
      showToast(`${badge ? badge.icon + ' ' + badge.name : 'Nivel completado'} desbloqueado. +${bonus} puntos de nivel.`);
    }

    function isActivityReady(activity) {
      const work = activityWork(activity.id);
      const mode = activity.interactive?.mode;
      if (mode === 'quiz') {
        const qCount = activity.interactive.questions.length;
        return work.evaluated && Object.keys(work.answers || {}).length >= qCount;
      }
      if (mode === 'scenario') return Number.isInteger(work.choiceIndex);
      if (mode === 'map') return safeArray(work.relations).length > 0 || String(work.reflection || '').trim().length >= 12;
      if (mode === 'comparison' || mode === 'matrix') return Object.values(work.cells || {}).some(v => String(v).trim().length >= 4);
      if (mode === 'projectStudy') return state.progress.visitedProjects.some(pid => (projectById(pid)?.levels || []).includes(activity.levelId)) || Object.values(work.fields || {}).some(v => String(v).trim().length >= 8);
      if (mode === 'capstone') return capstoneReady();
      return Object.values(work.fields || {}).some(v => String(v).trim().length >= 8) || String(work.reflection || '').trim().length >= 8;
    }

    function completeActivity(activityId) {
      const activity = activityById(activityId);
      if (!activity) return;
      if (isActivityDone(activityId)) {
        showToast('Esta actividad ya estaba completada. El bosque recuerda.');
        return;
      }
      if (!isActivityReady(activity)) {
        showToast('Añade evidencia de trabajo antes de completar la actividad.');
        return;
      }
      state.progress.completedActivities.push(activityId);
      state.progress.points += Number(activity.points || 0);
      saveState();
      showToast(`Actividad completada: +${activity.points || 0} puntos.`);
      completeLevelIfReady(activity.levelId);
      render();
    }

    function capstoneReady() {
      const c = state.progress.capstone || {};
      return capstoneFields.filter(([id]) => String(c[id] || '').trim().length >= 20).length >= 3;
    }

    function setView(view, payload) {
      currentView = view;
      if (view === 'nivel') currentLevelId = Number(payload);
      if (view === 'actividad') currentActivityId = String(payload);
      render();
      app.focus({ preventScroll: true });
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function updateNav() {
      nav.innerHTML = navItems.map(([id, label]) => `<button type="button" class="${currentView === id ? 'active' : ''}" onclick="App.go(${jsArg(id)})">${escapeHTML(label)}</button>`).join('');
    }

    function progressSummary() {
      const completedLevels = state.progress.completedLevels.length;
      const totalLevels = DATA.levels.length;
      const completedActivities = state.progress.completedActivities.length;
      const totalActivities = DATA.activities.length;
      const badges = state.progress.badges.length;
      return { completedLevels, totalLevels, completedActivities, totalActivities, badges };
    }

    function render() {
      updateNav();
      if (currentView === 'inicio') renderInicio();
      else if (currentView === 'niveles') renderNiveles();
      else if (currentView === 'nivel') renderNivel(currentLevelId);
      else if (currentView === 'actividad') renderActividad(currentActivityId);
      else if (currentView === 'proyectos') renderProyectos();
      else if (currentView === 'top') renderTopProjects();
      else if (currentView === 'prompts') renderPrompts();
      else if (currentView === 'progreso') renderProgreso();
      else if (currentView === 'capstone') renderCapstone();
      else renderInicio();
    }

    function renderInicio() {
      const s = progressSummary();
      const level = levelById(Math.min(state.progress.currentLevel, DATA.levels.length - 1)) || DATA.levels[0];
      app.innerHTML = `
        <section class="hero">
          <span class="eyebrow">🌿 PWA offline-ready · datos portables</span>
          <h1>Yocahú Agroecología PR</h1>
          <p><strong>Viaje por el Archipiélago Vivo.</strong> Aprende agroecología universitaria desde cero con niveles, retos jugables, proyectos insignia y prompts de mentoría.</p>
          <div class="hero-actions">
            <button class="sun" onclick="App.go('niveles')">Comenzar viaje</button>
            <button class="secondary" onclick="App.go('nivel', ${Number(level.id)})">Continuar nivel ${Number(level.id)}</button>
            <button class="ghost" onclick="App.go('capstone')">Abrir capstone</button>
          </div>
        </section>
        <section class="grid four" style="margin-top:1rem">
          ${statCard('Puntos', state.progress.points, 'Energía acumulada')}
          ${statCard('Nivel actual', Number(level.id), escapeHTML(level.title))}
          ${statCard('Badges', s.badges, 'Logros obtenidos')}
          ${statCard('Proyectos', state.progress.visitedProjects.length, 'Cartas visitadas')}
        </section>
        <div class="progress-wrap card" style="margin-top:1rem">
          <div class="progress-label"><span>Progreso del viaje</span><span>${s.completedLevels}/${s.totalLevels} niveles</span></div>
          <div class="progress-bar" aria-label="Progreso del viaje"><span style="width:${pct(s.completedLevels, s.totalLevels)}%"></span></div>
        </div>
        <section class="grid two" style="margin-top:1rem">
          <article class="card">
            <h2>Qué cambió en esta iteración</h2>
            <div class="chips"><span class="chip">📲 PWA instalable</span><span class="chip">📡 Offline con service worker</span><span class="chip">🎮 Actividades interactivas</span><span class="chip">🗂️ Datos en /data</span><span class="chip">⭐ Top 11 aumentado</span></div>
            <p class="muted">Para activar instalación y caché offline, abre la carpeta con un servidor local o publícala en HTTPS. Si abres el archivo directamente, funcionará con datos internos de respaldo, pero el service worker no puede registrarse por reglas del navegador.</p>
          </article>
          <article class="card">
            <h2>Principios pedagógicos</h2>
            <ul>${DATA.pedagogicalPrinciples.map(p => `<li>${escapeHTML(p)}</li>`).join('')}</ul>
          </article>
        </section>
      `;
    }

    function statCard(label, value, detail) {
      return `<article class="card stat"><span class="muted">${escapeHTML(label)}</span><b>${escapeHTML(value)}</b><small>${escapeHTML(detail)}</small></article>`;
    }

    function renderNiveles() {
      app.innerHTML = `
        <div class="section-title"><h2>Mapa de niveles</h2><button onclick="App.go('inicio')" class="secondary">Inicio</button></div>
        <p class="muted">Cada tarjeta indica su estado con texto e ícono: disponible, bloqueado o completado. El capstone aparece como cierre integrador.</p>
        <section class="grid three">
          ${DATA.levels.map(renderLevelCard).join('')}
        </section>
      `;
    }

    function renderLevelCard(level) {
      const status = getLevelStatus(level);
      const badge = badgeById(level.badgeId);
      const statusText = status === 'done' ? '✅ Completado' : status === 'available' ? '🟡 Disponible' : '🔒 Bloqueado';
      const acts = level.activityIds.map(activityById).filter(Boolean);
      const doneActs = acts.filter(a => isActivityDone(a.id)).length;
      return `
        <article class="card level-card">
          <div class="level-head">
            <span class="num">${Number(level.id)}</span>
            <div><h3>${escapeHTML(level.title)}</h3><span class="status ${status}">${statusText}</span></div>
          </div>
          <p><strong>Pregunta guía:</strong> ${escapeHTML(level.question)}</p>
          <p class="muted">${escapeHTML(level.summary)}</p>
          <div class="chips">${level.concepts.slice(0, 5).map(c => `<span class="chip">${escapeHTML(c)}</span>`).join('')}</div>
          <div class="progress-wrap">
            <div class="progress-label"><span>Actividades</span><span>${doneActs}/${acts.length}</span></div>
            <div class="progress-bar"><span style="width:${pct(doneActs, acts.length)}%"></span></div>
          </div>
          <p class="small">${badge ? `${badge.icon} Badge: ${escapeHTML(badge.name)}` : ''}</p>
          <button ${status === 'locked' ? 'disabled' : ''} onclick="App.go('nivel', ${Number(level.id)})">Abrir nivel</button>
        </article>
      `;
    }

    function renderNivel(id) {
      const level = levelById(id);
      if (!level) return renderNiveles();
      const status = getLevelStatus(level);
      if (status === 'locked') {
        app.innerHTML = `<article class="card"><h2>🔒 Nivel bloqueado</h2><p>Completa el nivel anterior para abrir este tramo del archipiélago.</p><button onclick="App.go('niveles')">Volver al mapa</button></article>`;
        return;
      }
      const activities = level.activityIds.map(activityById).filter(Boolean);
      const relatedProjects = DATA.projects.filter(p => safeArray(p.levels).map(Number).includes(Number(id))).slice(0, 6);
      const prompts = level.promptIds.map(promptById).filter(Boolean);
      const completed = activities.filter(a => isActivityDone(a.id)).length;
      app.innerHTML = `
        <div class="section-title"><h2>Nivel ${Number(level.id)} · ${escapeHTML(level.title)}</h2><button class="secondary" onclick="App.go('niveles')">Mapa</button></div>
        <section class="card">
          <span class="status ${status}">${status === 'done' ? '✅ Completado' : '🟡 Disponible'}</span>
          <p><strong>Pregunta guía:</strong> ${escapeHTML(level.question)}</p>
          <p>${escapeHTML(level.summary)}</p>
          <div class="chips">${level.concepts.map(c => `<span class="chip">${escapeHTML(c)}</span>`).join('')}</div>
          <div class="progress-wrap">
            <div class="progress-label"><span>Actividades completadas</span><span>${completed}/${activities.length}</span></div>
            <div class="progress-bar"><span style="width:${pct(completed, activities.length)}%"></span></div>
          </div>
        </section>
        <div class="section-title"><h2>Actividades jugables</h2></div>
        <section class="grid two">${activities.map(renderActivityCard).join('')}</section>
        <div class="section-title"><h2>Proyectos relacionados</h2><button class="secondary" onclick="App.go('proyectos')">Ver todos</button></div>
        <section class="grid two">${relatedProjects.map(renderProjectCard).join('')}</section>
        <div class="section-title"><h2>Prompt recomendado de Yocahú</h2></div>
        ${prompts.map(renderPromptCard).join('') || '<p>No hay prompt asignado todavía.</p>'}
      `;
    }

    function renderActivityCard(activity) {
      const done = isActivityDone(activity.id);
      const mode = activity.interactive?.mode || 'workbook';
      const modeLabel = { quiz:'Quiz', scenario:'Escenario', map:'Mapa', workbook:'Cuaderno', comparison:'Comparación', matrix:'Matriz', projectStudy:'Carta de proyecto', capstone:'Capstone' }[mode] || mode;
      return `
        <article class="card activity-card ${done ? 'done' : ''}">
          <span class="status ${done ? 'done' : 'available'}">${done ? '✅ Completada' : '🎮 Pendiente'}</span>
          <h3>${escapeHTML(activity.title)}</h3>
          <p>${escapeHTML(activity.instructions)}</p>
          <div class="chips"><span class="chip">${escapeHTML(modeLabel)}</span><span class="chip">+${Number(activity.points || 0)} puntos</span><span class="chip">${Number(activity.estimatedMinutes || 0)} min</span></div>
          <button onclick="App.go('actividad', ${jsArg(activity.id)})">Abrir actividad</button>
        </article>
      `;
    }

    function renderActividad(activityId) {
      const activity = activityById(activityId);
      if (!activity) return renderNiveles();
      const level = levelById(activity.levelId);
      const mode = activity.interactive?.mode || 'workbook';
      app.innerHTML = `
        <div class="section-title"><h2>${escapeHTML(activity.title)}</h2><button class="secondary" onclick="App.go('nivel', ${Number(activity.levelId)})">Volver al nivel</button></div>
        <section class="card">
          <div class="chips"><span class="chip">Nivel ${Number(activity.levelId)} · ${escapeHTML(level?.title || '')}</span><span class="chip">Tipo: ${escapeHTML(activity.type)}</span><span class="chip">+${Number(activity.points || 0)} puntos</span></div>
          <p>${escapeHTML(activity.instructions)}</p>
        </section>
        <section class="card" style="margin-top:1rem">${renderInteractive(activity, mode)}</section>
        <div class="actions">
          <button onclick="App.completeActivity(${jsArg(activity.id)})" ${isActivityDone(activity.id) ? 'disabled' : ''}>${isActivityDone(activity.id) ? 'Actividad completada' : `Completar y sumar ${Number(activity.points || 0)} puntos`}</button>
          <button class="secondary" onclick="App.go('nivel', ${Number(activity.levelId)})">Regresar</button>
        </div>
      `;
    }

    function renderInteractive(activity, mode) {
      if (mode === 'quiz') return renderQuiz(activity);
      if (mode === 'scenario') return renderScenario(activity);
      if (mode === 'map') return renderMap(activity);
      if (mode === 'comparison') return renderComparison(activity);
      if (mode === 'matrix') return renderMatrix(activity);
      if (mode === 'projectStudy') return renderProjectStudy(activity);
      if (mode === 'capstone') return `<h3>Capstone integrador</h3><p>${escapeHTML(activity.interactive.message)}</p><button onclick="App.go('capstone')">Abrir plantilla Capstone</button>`;
      return renderWorkbook(activity);
    }

    function renderQuiz(activity) {
      const work = activityWork(activity.id);
      work.answers ||= {};
      const questions = activity.interactive.questions || [];
      return `
        <h3>Quiz con retroalimentación</h3>
        ${questions.map((q, qi) => `
          <fieldset class="card" style="box-shadow:none; margin: .75rem 0;">
            <legend><strong>${qi + 1}. ${escapeHTML(q.question)}</strong></legend>
            ${q.options.map((opt, oi) => `
              <label class="quiz-option"><input type="radio" name="q-${activity.id}-${qi}" ${Number(work.answers[qi]) === oi ? 'checked' : ''} onchange="App.saveQuizAnswer(${jsArg(activity.id)}, ${qi}, ${oi})"> <span>${escapeHTML(opt)}</span></label>
            `).join('')}
            ${work.evaluated && work.answers[qi] !== undefined ? `<div class="feedback"><strong>${Number(work.answers[qi]) === q.answerIndex ? '✅ Correcto.' : '🌱 Revisa.'}</strong> ${escapeHTML(q.feedback)}</div>` : ''}
          </fieldset>
        `).join('')}
        <div class="actions"><button class="sun" onclick="App.evaluateQuiz(${jsArg(activity.id)})">Evaluar quiz</button>${work.evaluated ? `<span class="chip">Resultado: ${Number(work.score || 0)}/${questions.length}</span>` : ''}</div>
      `;
    }

    function renderScenario(activity) {
      const work = activityWork(activity.id);
      const choices = activity.interactive.choices || [];
      const selected = Number.isInteger(work.choiceIndex) ? work.choiceIndex : null;
      return `
        <h3>Escenario de decisión</h3>
        <p class="note-box">${escapeHTML(activity.interactive.context)}</p>
        ${choices.map((choice, index) => `<button class="choice ${selected === index ? 'selected' : ''}" onclick="App.chooseScenario(${jsArg(activity.id)}, ${index})">${escapeHTML(choice.label)}</button>`).join('')}
        ${selected !== null && choices[selected] ? `<div class="feedback"><strong>Puntuación de decisión: ${choices[selected].score}/3.</strong> ${escapeHTML(choices[selected].feedback)}</div>` : ''}
        <label for="scenario-reflection">${escapeHTML(activity.interactive.reflectionPrompt || 'Reflexión')}</label>
        <textarea id="scenario-reflection" oninput="App.saveActivityField(${jsArg(activity.id)}, 'reflection', this.value)">${escapeHTML(work.reflection || '')}</textarea>
      `;
    }

    function renderMap(activity) {
      const work = activityWork(activity.id);
      work.relations ||= [];
      const nodes = unique(activity.interactive.starterNodes || []);
      return `
        <h3>Constructor de mapa sistémico</h3>
        <p>Agrega relaciones entre elementos. No hay una sola respuesta correcta: aquí se cultiva mirada sistémica.</p>
        <div class="grid three">
          <div><label>Desde</label><select id="map-from">${nodes.map(n => `<option>${escapeHTML(n)}</option>`).join('')}</select></div>
          <div><label>Hacia</label><select id="map-to">${nodes.map(n => `<option>${escapeHTML(n)}</option>`).join('')}</select></div>
          <div><label>Relación</label><input id="map-rel" type="text" placeholder="ej. alimenta, protege, depende de"></div>
        </div>
        <div class="actions"><button class="sun" onclick="App.addRelation(${jsArg(activity.id)})">Añadir relación</button><button class="secondary" onclick="App.clearRelations(${jsArg(activity.id)})">Limpiar mapa</button></div>
        <ul class="relation-list">${work.relations.map((r, i) => `<li>${escapeHTML(r.from)} → <strong>${escapeHTML(r.relation)}</strong> → ${escapeHTML(r.to)} <button class="ghost" style="min-height:34px; padding:.25rem .55rem" onclick="App.removeRelation(${jsArg(activity.id)}, ${i})">quitar</button></li>`).join('') || '<li class="muted">Todavía no hay relaciones.</li>'}</ul>
        <div class="prompt-box" style="margin-top:1rem"><strong>Preguntas semilla:</strong><ul>${activity.interactive.relationPrompts.map(p => `<li>${escapeHTML(p)}</li>`).join('')}</ul></div>
        <label for="map-reflection">${escapeHTML(activity.interactive.reflectionPrompt || 'Reflexión del mapa')}</label>
        <textarea id="map-reflection" oninput="App.saveActivityField(${jsArg(activity.id)}, 'reflection', this.value)">${escapeHTML(work.reflection || '')}</textarea>
      `;
    }

    function renderWorkbook(activity) {
      const work = activityWork(activity.id);
      work.fields ||= {};
      const fields = activity.interactive.fields || [];
      return `
        <h3>Cuaderno interactivo</h3>
        <div class="grid two">
          ${fields.map(field => `<div><label>${escapeHTML(field.label)}</label><textarea oninput="App.saveWorkbookField(${jsArg(activity.id)}, ${jsArg(field.id)}, this.value)">${escapeHTML(work.fields[field.id] || '')}</textarea></div>`).join('')}
        </div>
        <label>${escapeHTML(activity.interactive.reflectionPrompt || 'Reflexión final')}</label>
        <textarea oninput="App.saveActivityField(${jsArg(activity.id)}, 'reflection', this.value)">${escapeHTML(work.reflection || '')}</textarea>
      `;
    }

    function renderComparison(activity) {
      const work = activityWork(activity.id); work.cells ||= {};
      const criteria = activity.interactive.criteria || [];
      const items = activity.interactive.items || ['A', 'B'];
      return `
        <h3>Misión de comparación</h3>
        <div class="table-wrap"><table><thead><tr><th>Criterio</th>${items.map(i => `<th>${escapeHTML(i)}</th>`).join('')}<th>Aprendizaje</th></tr></thead><tbody>
        ${criteria.map((c, ri) => `<tr><th>${escapeHTML(c)}</th>${items.map((item, ci) => `<td><textarea oninput="App.saveCell(${jsArg(activity.id)}, ${jsArg(`r${ri}c${ci}`)}, this.value)">${escapeHTML(work.cells[`r${ri}c${ci}`] || '')}</textarea></td>`).join('')}<td><textarea oninput="App.saveCell(${jsArg(activity.id)}, ${jsArg(`r${ri}learn`)}, this.value)">${escapeHTML(work.cells[`r${ri}learn`] || '')}</textarea></td></tr>`).join('')}
        </tbody></table></div>
      `;
    }

    function renderMatrix(activity) {
      const work = activityWork(activity.id); work.cells ||= {};
      const rows = activity.interactive.rows || [];
      const columns = activity.interactive.columns || [];
      return `
        <h3>Matriz de gobernanza</h3>
        <div class="table-wrap"><table><thead><tr><th>Área</th>${columns.map(c => `<th>${escapeHTML(c)}</th>`).join('')}</tr></thead><tbody>
        ${rows.map((r, ri) => `<tr><th>${escapeHTML(r)}</th>${columns.map((c, ci) => `<td><textarea oninput="App.saveCell(${jsArg(activity.id)}, ${jsArg(`r${ri}c${ci}`)}, this.value)">${escapeHTML(work.cells[`r${ri}c${ci}`] || '')}</textarea></td>`).join('')}</tr>`).join('')}
        </tbody></table></div>
      `;
    }

    function renderProjectStudy(activity) {
      const levelProjects = DATA.projects.filter(p => safeArray(p.levels).map(Number).includes(Number(activity.levelId))).slice(0, 4);
      return `
        <h3>Carta de proyecto aplicada</h3>
        <p>Visita una carta y extrae una práctica para adaptar a escala educativa.</p>
        <section class="grid two">${levelProjects.map(renderProjectCard).join('')}</section>
        ${renderWorkbook(activity)}
      `;
    }

    function mediaFigure(record, fallbackLabel) {
      const url = safeUrl(record?.imageUrl);
      const alt = record?.imageAlt || fallbackLabel || 'Imagen del proyecto';
      if (url) return `<div class="project-media"><img src="${escapeHTML(url)}" alt="${escapeHTML(alt)}" loading="lazy"></div>`;
      return `<div class="project-media" aria-label="Imagen opcional pendiente">📷 Imagen opcional<br><span class="small">Añade imageUrl en JSON</span></div>`;
    }

    function sourceLink(record) {
      const url = safeUrl(record?.sourceUrl);
      if (!url) return `<span class="chip">🔎 Fuente URL opcional pendiente</span>`;
      const label = record?.sourceLabel || 'Fuente del perfil';
      return `<a class="chip" href="${escapeHTML(url)}" target="_blank" rel="noopener noreferrer">🔎 ${escapeHTML(label)}</a>`;
    }

    function renderProjectCard(project) {
      const visited = state.progress.visitedProjects.includes(project.id);
      const ficha = compactFichaByProjectId(project.id) || {};
      const rank = topRankForProject(project.id);
      return `
        <article class="card project-card ${rank ? 'top-project-card' : ''}" tabindex="0" role="button" aria-label="Abrir ficha de ${escapeHTML(project.name)}" onclick="if(!event.target.closest('button,a')) App.openProjectFicha(${jsArg(project.id)})" onkeydown="if((event.key==='Enter'||event.key===' ')&&!event.target.closest('button,a')){event.preventDefault();App.openProjectFicha(${jsArg(project.id)})}">
          ${rank ? `<button class="star-button" type="button" title="Abrir perfil aumentado Top ${rank}" aria-label="Abrir perfil aumentado Top ${rank}" onclick="App.openTopProfile(${jsArg(project.id)})">⭐</button>` : ''}
          <div class="project-top"><div class="project-avatar">${iconFor(project.avatar?.icon)}</div><div><h3>${rank ? `<span class="chip star-badge">Top ${rank}</span> ` : ''}${escapeHTML(project.name)}</h3><p class="muted small">${escapeHTML(project.region)}</p></div></div>
          <p class="description-clamp">${escapeHTML(project.description)}</p>
          <div class="chips"><span class="chip">${escapeHTML(project.biome)}</span>${project.categories.slice(0, 3).map(c => `<span class="chip">${escapeHTML(String(c).replace(/\.$/, ''))}</span>`).join('')}</div>
          <p class="small"><strong>Avatar:</strong> ${escapeHTML(project.avatar?.name || 'Yocahú')} · ${escapeHTML(project.avatar?.role || '')}</p>
          <div class="actions"><button class="secondary" onclick="App.openProjectFicha(${jsArg(project.id)})">Ver ficha compacta</button>${rank ? `<button class="sun" onclick="App.openTopProfile(${jsArg(project.id)})">⭐ Perfil aumentado</button>` : ''}<button class="${visited ? 'secondary' : ''}" onclick="App.visitProject(${jsArg(project.id)})">${visited ? '✅ Visitado' : 'Registrar visita'}</button></div>
        </article>
      `;
    }

    function renderTopProjects() {
      const profiles = DATA.topProfiles?.profiles || [];
      app.innerHTML = `
        <div class="section-title"><h2>⭐ Top 11 · perfiles aumentados</h2><span class="chip">${profiles.length} perfiles</span></div>
        <section class="card">
          <p>Esta sección reúne los proyectos seleccionados del Lote A+ con perfiles ampliados. Son fichas preliminares para estudio, entrevistas y verificación comunitaria antes de publicación formal.</p>
          <div class="actions"><button class="secondary" onclick="App.go('proyectos')">Ver los 50 proyectos</button></div>
        </section>
        <section class="card filters" style="margin-top:1rem">
          <div><label for="topSearch">Buscar Top 11</label><input type="search" id="topSearch" placeholder="Vieques, tierra, universidad, agua..." oninput="App.filterTopProjects()"></div>
          <div><label for="topBiome">Bioma</label><select id="topBiome" onchange="App.filterTopProjects()"><option value="">Todos</option>${unique(profiles.map(p => p.biome)).sort().map(b => `<option>${escapeHTML(b)}</option>`).join('')}</select></div>
          <div><label for="topCertainty">Tipo de ficha</label><select id="topCertainty" onchange="App.filterTopProjects()"><option value="">Todas</option><option value="aumentado">Perfil aumentado</option></select></div>
        </section>
        <section id="topGrid" class="grid two" style="margin-top:1rem"></section>
      `;
      filterTopProjects();
    }

    function renderTopProfileCard(profile) {
      const project = projectById(profile.projectId) || {};
      const summary = profile.summary || project.description || '';
      return `
        <article class="card project-card top-project-card">
          <button class="star-button" type="button" title="Abrir perfil aumentado" onclick="App.openTopProfile(${jsArg(profile.projectId)})">⭐</button>
          <div class="project-top"><div class="project-avatar">${iconFor(project.avatar?.icon)}</div><div><h3><span class="chip star-badge">Top ${Number(profile.rank)}</span> ${escapeHTML(profile.name)}</h3><p class="muted small">${escapeHTML(profile.region || project.region || '')}</p></div></div>
          <p class="description-clamp">${escapeHTML(summary)}</p>
          <div class="chips"><span class="chip">${escapeHTML(profile.biome || project.biome || '')}</span><span class="chip">${escapeHTML(profile.code || '')}</span>${sourceLink(profile)}</div>
          <div class="actions"><button class="sun" onclick="App.openTopProfile(${jsArg(profile.projectId)})">Abrir perfil aumentado</button><button class="secondary" onclick="App.openProjectFicha(${jsArg(profile.projectId)})">Ficha compacta</button></div>
        </article>
      `;
    }

    function filterTopProjects() {
      const q = ($('#topSearch')?.value || '').trim().toLowerCase();
      const biome = $('#topBiome')?.value || '';
      const profiles = (DATA.topProfiles?.profiles || []).filter(p => {
        const project = projectById(p.projectId) || {};
        const hay = [p.name, p.region, p.biome, p.code, p.summary, project.description].join(' ').toLowerCase();
        return (!q || hay.includes(q)) && (!biome || p.biome === biome);
      });
      $('#topGrid').innerHTML = profiles.map(renderTopProfileCard).join('') || '<article class="card"><h3>No encontré perfiles con esos filtros.</h3></article>';
    }

    function renderProyectos() {
      const biomes = unique(DATA.projects.map(p => p.biome)).sort();
      app.innerHTML = `
        <div class="section-title"><h2>Proyectos insignia</h2><span class="chip">${DATA.projects.length} cartas</span></div>
        <section class="card">
          <h3>⭐ Atajo a perfiles aumentados</h3>
          <p>Las tarjetas marcadas con estrella pertenecen al Top 11. Toca la estrella para abrir el perfil detallado y aumentado. Las demás tarjetas abren ficha compacta.</p>
          <button class="sun" onclick="App.go('top')">Abrir sección Top 11</button>
        </section>
        <section class="card filters" style="margin-top:1rem">
          <div><label for="projectSearch">Buscar</label><input type="search" id="projectSearch" placeholder="semillas, Vieques, café, mercado..." oninput="App.filterProjects()"></div>
          <div><label for="biomeFilter">Bioma</label><select id="biomeFilter" onchange="App.filterProjects()"><option value="">Todos</option>${biomes.map(b => `<option>${escapeHTML(b)}</option>`).join('')}</select></div>
          <div><label for="regionFilter">Región</label><input type="text" id="regionFilter" placeholder="ej. Utuado" oninput="App.filterProjects()"></div>
        </section>
        <section id="projectsGrid" class="grid two" style="margin-top:1rem"></section>
      `;
      filterProjects();
    }

    function filterProjects() {
      const q = ($('#projectSearch')?.value || '').trim().toLowerCase();
      const biome = $('#biomeFilter')?.value || '';
      const region = ($('#regionFilter')?.value || '').trim().toLowerCase();
      const filtered = DATA.projects.filter(p => {
        const ficha = compactFichaByProjectId(p.id) || {};
        const hay = [p.name, p.region, p.description, p.biome, ficha.systemsDescription, ...(p.categories || [])].join(' ').toLowerCase();
        return (!q || hay.includes(q)) && (!biome || p.biome === biome) && (!region || String(p.region).toLowerCase().includes(region));
      });
      $('#projectsGrid').innerHTML = filtered.map(renderProjectCard).join('') || '<article class="card"><h3>No encontré proyectos con esos filtros.</h3><p>Prueba otro bioma o una palabra más amplia.</p></article>';
    }

    function renderPromptCard(prompt) {
      const saved = state.progress.savedPrompts.includes(prompt.id);
      return `
        <article class="card" style="margin-bottom:1rem">
          <h3>${escapeHTML(prompt.title)}</h3>
          <div class="chips"><span class="chip">Nivel ${Number(prompt.levelId)}</span><span class="chip">Complejidad ${Number(prompt.complexity)}</span>${saved ? '<span class="chip">📌 Copiado antes</span>' : ''}</div>
          <div class="prompt-box"><p class="prompt-text">${escapeHTML(prompt.prompt)}</p></div>
          <div class="actions"><button onclick="App.copyPrompt(${jsArg(prompt.id)})">Copiar prompt</button><button class="secondary" onclick="App.go('nivel', ${Number(prompt.levelId)})">Ver nivel</button></div>
        </article>
      `;
    }

    function renderPrompts() {
      const levels = DATA.levels.map(l => l.id);
      const complexities = unique(DATA.prompts.map(p => Number(p.complexity))).sort((a,b) => a-b);
      app.innerHTML = `
        <div class="section-title"><h2>Yocahú Prompts</h2><span class="chip">Mentoría copiable MVP</span></div>
        <section class="card"><p>En esta fase, Yocahú no está integrado como chatbot. Funciona como una biblioteca de prompts cálidos, universitarios y socráticos para copiar en otra conversación.</p></section>
        <section class="card filters" style="margin-top:1rem">
          <div><label for="promptSearch">Buscar</label><input type="search" id="promptSearch" placeholder="suelo, semillas, economía..." oninput="App.filterPrompts()"></div>
          <div><label for="promptLevel">Nivel</label><select id="promptLevel" onchange="App.filterPrompts()"><option value="">Todos</option>${levels.map(id => `<option value="${id}">${id}</option>`).join('')}</select></div>
          <div><label for="promptComplexity">Complejidad</label><select id="promptComplexity" onchange="App.filterPrompts()"><option value="">Todas</option>${complexities.map(c => `<option value="${c}">${c}</option>`).join('')}</select></div>
        </section>
        <section id="promptsGrid" style="margin-top:1rem"></section>
      `;
      filterPrompts();
    }

    function filterPrompts() {
      const q = ($('#promptSearch')?.value || '').trim().toLowerCase();
      const level = $('#promptLevel')?.value;
      const complexity = $('#promptComplexity')?.value;
      const filtered = DATA.prompts.filter(p => {
        const hay = [p.title, p.prompt].join(' ').toLowerCase();
        return (!q || hay.includes(q)) && (!level || Number(p.levelId) === Number(level)) && (!complexity || Number(p.complexity) === Number(complexity));
      });
      $('#promptsGrid').innerHTML = filtered.map(renderPromptCard).join('') || '<article class="card"><h3>No encontré prompts con esos filtros.</h3></article>';
    }

    function renderProgreso() {
      const s = progressSummary();
      const badges = state.progress.badges.map(badgeById).filter(Boolean);
      app.innerHTML = `
        <div class="section-title"><h2>Progreso</h2><button class="secondary" onclick="App.go('inicio')">Inicio</button></div>
        <section class="grid four">
          ${statCard('Puntos', state.progress.points, 'Total acumulado')}
          ${statCard('Niveles', `${s.completedLevels}/${s.totalLevels}`, 'Completados')}
          ${statCard('Actividades', `${s.completedActivities}/${s.totalActivities}`, 'Completadas')}
          ${statCard('Proyectos', state.progress.visitedProjects.length, 'Visitados')}
        </section>
        <section class="card" style="margin-top:1rem">
          <h3>Exportar, importar y guías</h3>
          <p class="muted">La exportación incluye <code>appVersion</code>, <code>userProfile</code> y <code>progress</code>. La importación valida que exista <code>progress</code> y no ejecuta contenido del archivo.</p>
          <div class="actions"><button onclick="App.exportProgress()">Exportar avance JSON</button><label class="button secondary" for="importFile">Importar avance JSON</label><input class="sr-only" id="importFile" type="file" accept="application/json,.json" onchange="App.importProgress(event)"><button class="clay" onclick="App.resetProgress()">Reiniciar avance</button></div>
          <div id="guideHost">${renderGuidesPanel()}</div>
        </section>
        <section class="card" style="margin-top:1rem">
          <h3>Badges obtenidos</h3>
          <div class="grid three">${badges.map(b => `<article class="card" style="box-shadow:none"><h4>${b.icon} ${escapeHTML(b.name)}</h4><p>${escapeHTML(b.description)}</p></article>`).join('') || '<p class="muted">Aún no hay badges. El primer brote llega al completar el nivel 0.</p>'}</div>
        </section>
        <section class="grid two" style="margin-top:1rem">
          <article class="card"><h3>Actividades completadas</h3><ul>${state.progress.completedActivities.map(id => `<li>${escapeHTML(activityById(id)?.title || id)}</li>`).join('') || '<li>Ninguna todavía.</li>'}</ul></article>
          <article class="card"><h3>Proyectos visitados</h3><ul>${state.progress.visitedProjects.map(id => `<li>${escapeHTML(projectById(id)?.name || id)}</li>`).join('') || '<li>Ninguno todavía.</li>'}</ul></article>
        </section>
      `;
    }

    function renderCapstone() {
      state.progress.capstone ||= {};
      const c = state.progress.capstone;
      const capActivity = DATA.activities.find(a => a.type === 'capstone') || DATA.activities.find(a => a.id.includes('capstone'));
      app.innerHTML = `
        <div class="section-title"><h2>Capstone · Mi Agroecosistema Boricua</h2><span class="chip">+500 puntos</span></div>
        <section class="card">
          <p>Integra diagnóstico territorial, mapa sistémico, diseño agroecológico y reflexión ética. Tus notas se guardan localmente y viajan dentro del JSON exportado.</p>
          <div class="progress-wrap"><div class="progress-label"><span>Campos sustantivos</span><span>${capstoneFields.filter(([id]) => String(c[id] || '').trim().length >= 20).length}/${capstoneFields.length}</span></div><div class="progress-bar"><span style="width:${pct(capstoneFields.filter(([id]) => String(c[id] || '').trim().length >= 20).length, capstoneFields.length)}%"></span></div></div>
        </section>
        <section class="grid two" style="margin-top:1rem">
          ${capstoneFields.map(([id, label, help]) => `<div class="card"><label for="cap-${id}">${escapeHTML(label)}</label><p class="muted small">${escapeHTML(help)}</p><textarea id="cap-${id}" oninput="App.saveCapstone(${jsArg(id)}, this.value)">${escapeHTML(c[id] || '')}</textarea></div>`).join('')}
        </section>
        <div class="actions"><button onclick="App.saveCapstoneNow()">Guardar notas</button>${capActivity ? `<button class="sun" onclick="App.completeActivity(${jsArg(capActivity.id)})" ${isActivityDone(capActivity.id) ? 'disabled' : ''}>${isActivityDone(capActivity.id) ? 'Capstone completado' : 'Completar capstone'}</button>` : ''}<button class="secondary" onclick="App.exportProgress()">Exportar con notas</button></div>
        <div class="section-title"><h2>Rúbrica</h2></div>
        <div class="table-wrap"><table><thead><tr><th>Criterio</th><th>1 Inicial</th><th>2 En desarrollo</th><th>3 Sólido</th><th>4 Excelente</th></tr></thead><tbody>
          ${DATA.capstoneRubric.map(r => `<tr><th>${escapeHTML(r.criterion)}</th>${r.levels.map(l => `<td>${escapeHTML(l)}</td>`).join('')}</tr>`).join('')}
        </tbody></table></div>
      `;
    }

    function saveQuizAnswer(activityId, qIndex, optionIndex) {
      const work = activityWork(activityId);
      work.answers ||= {};
      work.answers[qIndex] = optionIndex;
      work.evaluated = false;
      saveState();
    }

    function evaluateQuiz(activityId) {
      const activity = activityById(activityId);
      const work = activityWork(activityId);
      work.answers ||= {};
      const questions = activity.interactive.questions || [];
      const missing = questions.some((_, i) => work.answers[i] === undefined);
      if (missing) { showToast('Contesta todas las preguntas antes de evaluar.'); return; }
      work.score = questions.reduce((sum, q, i) => sum + (Number(work.answers[i]) === Number(q.answerIndex) ? 1 : 0), 0);
      work.evaluated = true;
      saveState();
      renderActividad(activityId);
      showToast(`Quiz evaluado: ${work.score}/${questions.length}.`);
    }

    function chooseScenario(activityId, index) {
      const work = activityWork(activityId);
      work.choiceIndex = index;
      saveState();
      renderActividad(activityId);
    }

    function saveActivityField(activityId, field, value) {
      const work = activityWork(activityId);
      work[field] = String(value || '');
      saveState();
    }

    function saveWorkbookField(activityId, field, value) {
      const work = activityWork(activityId);
      work.fields ||= {};
      work.fields[field] = String(value || '');
      saveState();
    }

    function saveCell(activityId, key, value) {
      const work = activityWork(activityId);
      work.cells ||= {};
      work.cells[key] = String(value || '');
      saveState();
    }

    function addRelation(activityId) {
      const from = $('#map-from')?.value;
      const to = $('#map-to')?.value;
      const relation = ($('#map-rel')?.value || '').trim();
      if (!from || !to || !relation) { showToast('Completa desde, hacia y relación.'); return; }
      const work = activityWork(activityId);
      work.relations ||= [];
      work.relations.push({ from, to, relation });
      saveState();
      renderActividad(activityId);
      showToast('Relación añadida al mapa.');
    }

    function removeRelation(activityId, index) {
      const work = activityWork(activityId);
      work.relations ||= [];
      work.relations.splice(index, 1);
      saveState();
      renderActividad(activityId);
    }

    function clearRelations(activityId) {
      if (!confirm('¿Limpiar todas las relaciones de este mapa?')) return;
      const work = activityWork(activityId);
      work.relations = [];
      saveState();
      renderActividad(activityId);
    }


    function markProjectVisited(projectId, silent = false) {
      if (!state.progress.visitedProjects.includes(projectId)) {
        state.progress.visitedProjects.push(projectId);
        saveState();
        if (!silent) showToast('Proyecto registrado como visitado.');
        return true;
      }
      if (!silent) showToast('Ese proyecto ya estaba visitado.');
      return false;
    }

    function formatMarkdownish(textValue) {
      const text = String(textValue || '').trim();
      if (!text) return '<p class="muted">Pendiente de completar.</p>';
      const blocks = text.split(/\n\s*\n/).filter(Boolean);
      return blocks.map(block => {
        const lines = block.split('\n').map(line => line.trim()).filter(Boolean);
        if (lines.every(line => /^[-*]\s+/.test(line))) {
          return `<ul>${lines.map(line => `<li>${escapeHTML(line.replace(/^[-*]\s+/, '')).replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>')}</li>`).join('')}</ul>`;
        }
        return `<p>${escapeHTML(lines.join(' ')).replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>')}</p>`;
      }).join('');
    }

    function openProjectFicha(projectId) {
      const project = projectById(projectId);
      if (!project) return;
      const ficha = compactFichaByProjectId(projectId) || {};
      markProjectVisited(projectId, true);
      const title = ficha.name || project.name;
      $('#projectModalTitle').textContent = title;
      $('#projectModalSubtitle').textContent = `${ficha.code || 'Ficha compacta'} · ${ficha.municipioRegion || project.region || ''}`;
      $('#projectModalBody').innerHTML = `
        <div class="grid two">
          <div>${mediaFigure(ficha, title)}</div>
          <div>
            <div class="chips"><span class="chip">${escapeHTML(project.biome || '')}</span><span class="chip">${escapeHTML(ficha.type || 'Tipo por verificar')}</span><span class="chip">${escapeHTML(ficha.status || 'Estatus por verificar')}</span>${sourceLink(ficha)}</div>
            <p><strong>Descripción sistémica:</strong> ${escapeHTML(ficha.systemsDescription || project.description || '')}</p>
            <p class="small muted">Campos de imagen y fuente son opcionales: edita <code>data/project_fichas_compactas.json</code> para añadir <code>imageUrl</code>, <code>imageAlt</code>, <code>sourceUrl</code> y <code>sourceLabel</code>.</p>
          </div>
        </div>
        <section class="profile-section"><h3>Territorio y prácticas</h3><div class="markdownish">
          <p><strong>Microclima / territorio:</strong> ${escapeHTML(ficha.microclimateTerritory || 'Pendiente de verificación.')}</p>
          <p><strong>Prácticas:</strong> ${escapeHTML(ficha.mainAgroecologicalPractices || 'Pendiente de verificación.')}</p>
          <p><strong>Biodiversidad y cultivos:</strong> ${escapeHTML(ficha.biodiversityKeyCrops || 'Pendiente de verificación.')}</p>
        </div></section>
        <section class="profile-section"><h3>Dimensiones sistémicas</h3><div class="markdownish">
          <p><strong>Cultural / saberes:</strong> ${escapeHTML(ficha.culturalKnowledgeDimension || 'Pendiente.')}</p>
          <p><strong>Educativa:</strong> ${escapeHTML(ficha.educationalDimension || 'Pendiente.')}</p>
          <p><strong>Económica / distribución:</strong> ${escapeHTML(ficha.economicDistributionDimension || 'Pendiente.')}</p>
        </div></section>
        <section class="profile-section"><h3>Aportes, retos y verificación</h3><div class="markdownish">
          <p><strong>Soberanía/seguridad alimentaria:</strong> ${escapeHTML(ficha.foodSovereigntyContribution || 'Pendiente.')}</p>
          <p><strong>Resiliencia climática:</strong> ${escapeHTML(ficha.climateResilienceContribution || 'Pendiente.')}</p>
          <p><strong>Redes y alianzas:</strong> ${escapeHTML(ficha.networksAlliances || 'Pendiente.')}</p>
          <p><strong>Fortalezas:</strong> ${escapeHTML(ficha.strengths || 'Pendiente.')}</p>
          <p><strong>Retos:</strong> ${escapeHTML(ficha.challenges || 'Pendiente.')}</p>
          <p><strong>Preguntas pendientes:</strong> ${escapeHTML(ficha.pendingVerificationQuestions || 'Pendiente.')}</p>
          <p><strong>Fuentes sugeridas:</strong> ${escapeHTML(ficha.suggestedSources || 'Pendiente.')}</p>
          <p><strong>Nivel de certeza:</strong> ${escapeHTML(ficha.certaintyLevel || 'Pendiente.')}</p>
        </div></section>
        ${isTopProject(projectId) ? `<div class="actions"><button class="sun" onclick="App.openTopProfile(${jsArg(projectId)})">⭐ Abrir perfil aumentado Top ${topRankForProject(projectId)}</button></div>` : ''}
      `;
      $('#projectModal').hidden = false;
    }

    function openTopProfile(projectId) {
      const project = projectById(projectId);
      const profile = expandedProfileByProjectId(projectId);
      if (!project || !profile) {
        openProjectFicha(projectId);
        return;
      }
      markProjectVisited(projectId, true);
      $('#projectModalTitle').textContent = `⭐ Top ${profile.rank}: ${profile.name}`;
      $('#projectModalSubtitle').textContent = `${profile.code || ''} · ${profile.region || project.region || ''} · perfil aumentado`;
      $('#projectModalBody').innerHTML = `
        <div class="grid two">
          <div>${mediaFigure(profile, profile.name)}</div>
          <div>
            <div class="chips"><span class="chip star-badge">Top ${Number(profile.rank)}</span><span class="chip">${escapeHTML(profile.biome || project.biome || '')}</span><span class="chip">${escapeHTML(profile.status || 'Estatus por verificar')}</span>${sourceLink(profile)}</div>
            <p>${escapeHTML(profile.summary || project.description || '')}</p>
            <p class="small muted">Perfil preliminar aumentado del Lote A+. Para añadir imagen o fuente, edita <code>data/top_project_profiles.json</code>.</p>
          </div>
        </div>
        ${(profile.sections || []).map(section => `<section class="profile-section"><h3>${escapeHTML(section.heading)}</h3><div class="markdownish">${formatMarkdownish(section.body)}</div></section>`).join('')}
      `;
      $('#projectModal').hidden = false;
    }

    function closeProjectModal() {
      $('#projectModal').hidden = true;
      $('#projectModalBody').innerHTML = '';
    }

    function renderGuidesPanel(activeId = 'user-guide') {
      const guides = DATA.guides?.guides || [];
      const active = guides.find(g => g.id === activeId) || guides[0];
      if (!guides.length) return '<p class="muted">Guías no disponibles en esta carga.</p>';
      return `
        <div class="guide-tabs" aria-label="Guías y documentación">
          ${guides.map(g => `<button type="button" class="${active?.id === g.id ? 'sun' : 'secondary'}" onclick="App.showGuide(${jsArg(g.id)})">${escapeHTML(g.title)}</button>`).join('')}
        </div>
        <div id="guidePanel" class="guide-panel markdownish">${formatMarkdownish(active?.content || active?.summary || '')}</div>
      `;
    }

    function showGuide(guideId) {
      const panelHost = $('#guideHost');
      if (!panelHost) return;
      panelHost.innerHTML = renderGuidesPanel(guideId);
    }

    function visitProject(projectId) {
      markProjectVisited(projectId, false);
      render();
    }

    async function copyPrompt(promptId) {
      const prompt = promptById(promptId);
      if (!prompt) return;
      try {
        await navigator.clipboard.writeText(prompt.prompt);
      } catch {
        const area = document.createElement('textarea');
        area.value = prompt.prompt;
        document.body.appendChild(area);
        area.select();
        document.execCommand('copy');
        area.remove();
      }
      if (!state.progress.savedPrompts.includes(promptId)) state.progress.savedPrompts.push(promptId);
      saveState();
      showToast('Prompt copiado. Yocahú va en tu mochila.');
      render();
    }

    function saveCapstone(field, value) {
      state.progress.capstone ||= {};
      state.progress.capstone[field] = String(value || '');
      saveState();
    }

    function saveCapstoneNow() {
      saveState();
      showToast('Notas del capstone guardadas en este dispositivo.');
      renderCapstone();
    }

    function exportProgress() {
      const payload = normalizeProgress(state);
      payload.appVersion = DATA.metadata?.version || state.appVersion;
      const blob = new Blob([JSON.stringify(payload, null, 2)], { type: 'application/json' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      const date = new Date().toISOString().slice(0, 10);
      a.href = url;
      a.download = `yocahu-avance-${date}.json`;
      document.body.appendChild(a);
      a.click();
      a.remove();
      URL.revokeObjectURL(url);
      showToast('Avance exportado como JSON.');
    }

    function importProgress(event) {
      const file = event.target.files?.[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = () => {
        try {
          const parsed = JSON.parse(String(reader.result || '{}'));
          if (!parsed || typeof parsed !== 'object' || !parsed.progress) throw new Error('missing-progress');
          localStorage.setItem(BACKUP_KEY, JSON.stringify(state));
          state = normalizeProgress(parsed);
          saveState();
          showToast('Avance importado correctamente. Se guardó una copia temporal del progreso anterior.');
          currentView = 'progreso';
          render();
        } catch (error) {
          showToast('Archivo inválido: debe ser JSON y contener progress.');
        } finally {
          event.target.value = '';
        }
      };
      reader.readAsText(file);
    }

    function resetProgress() {
      if (!confirm('¿Reiniciar todo el avance local? Puedes exportarlo antes para conservar copia.')) return;
      localStorage.setItem(BACKUP_KEY, JSON.stringify(state));
      state = defaultState();
      saveState();
      showToast('Avance reiniciado. Se guardó una copia temporal anterior.');
      render();
    }

    function updateNetworkStatus() {
      const pill = $('#networkStatus');
      if (!pill) return;
      const online = navigator.onLine;
      pill.textContent = online ? 'En línea' : 'Offline';
      pill.style.background = online ? '#fff' : '#fff8d9';
    }

    function registerPWA() {
      const installBtn = $('#installBtn');
      window.addEventListener('beforeinstallprompt', (event) => {
        event.preventDefault();
        deferredInstall = event;
        installBtn.hidden = false;
      });
      installBtn.addEventListener('click', async () => {
        if (!deferredInstall) return;
        deferredInstall.prompt();
        await deferredInstall.userChoice;
        deferredInstall = null;
        installBtn.hidden = true;
      });
      if ('serviceWorker' in navigator && location.protocol !== 'file:') {
        navigator.serviceWorker.register('./sw.js').then(() => {
          console.info('Service worker registrado.');
        }).catch(error => console.warn('No se pudo registrar service worker', error));
      }
    }

    async function init() {
      DATA = await loadData();
      state = loadState();
      updateNetworkStatus();
      window.addEventListener('online', updateNetworkStatus);
      window.addEventListener('offline', updateNetworkStatus);
      window.addEventListener('keydown', (event) => { if (event.key === 'Escape' && $('#projectModal') && !$('#projectModal').hidden) closeProjectModal(); });
      $('#projectModal')?.addEventListener('click', (event) => { if (event.target.id === 'projectModal') closeProjectModal(); });
      registerPWA();
      render();
    }

    window.App = {
      go: setView,
      completeActivity,
      saveQuizAnswer,
      evaluateQuiz,
      chooseScenario,
      saveActivityField,
      saveWorkbookField,
      saveCell,
      addRelation,
      removeRelation,
      clearRelations,
      visitProject,
      openProjectFicha,
      openTopProfile,
      closeProjectModal,
      showGuide,
      copyPrompt,
      filterProjects,
      filterTopProjects,
      filterPrompts,
      saveCapstone,
      saveCapstoneNow,
      exportProgress,
      importProgress,
      resetProgress
    };

    init().catch(error => {
      console.error(error);
      app.innerHTML = '<article class="card"><h1>No se pudo iniciar la aplicación</h1><p>Revisa que los archivos JSON estén disponibles en /data o abre nuevamente el paquete.</p></article>';
    });
  })();
  </script>
</body>
</html>
